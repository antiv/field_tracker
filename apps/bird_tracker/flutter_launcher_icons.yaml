# Konfiguracija ikonice aplikacije (flutter_launcher_icons).
# Generiši:  fvm dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "android/app/src/main/ic_launcher-playstore.png"

  android: false
  ios: true

  # iOS ne sme alfu/providnost — poravnaj na belu pozadinu.
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

  # Android adaptive icon (Android 8+).
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "android/app/src/main/ic_launcher-playstore.png"
  min_sdk_android: 23
